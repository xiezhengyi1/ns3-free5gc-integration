[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ns3-free5gc-integration"
version = "0.1.0"
description = "Split control-plane/user-plane orchestration for free5GC, UERANSIM, and ns-3 NR."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "requests>=2.32",
]

[tool.setuptools.packages.find]
include = ["bridge*", "adapters*"]
